version: '3.9'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: compactify_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-compactify_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-compactify_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - compactify_network

  # Flask Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compactify_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Flask Configuration
      FLASK_APP: server.py
      FLASK_ENV: ${FLASK_ENV:-production}
      DEBUG: ${DEBUG:-False}

      # Database Configuration
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-compactify_db}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-compactify_db}

      # Python Configuration
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONPATH: /app
      OPENCV_LOG_LEVEL: ERROR

      # Application Configuration
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}

    ports:
      - "${WEB_PORT:-5000}:5000"

    volumes:
      # Upload directories untuk persistent storage
      - ./app/static/uploads:/app/app/static/uploads
      - ./app/static/CompressImg:/app/app/static/CompressImg
      - ./app/static/CompressPdf:/app/app/static/CompressPdf
      - ./app/static/docToPdf:/app/app/static/docToPdf
      - ./app/static/imagetopdf:/app/app/static/imagetopdf
      - ./app/static/imgtogray:/app/app/static/imgtogray
      - ./app/static/removeBackground:/app/app/static/removeBackground
      - ./app/static/zip:/app/app/static/zip
      - ./app/static/CompressAudio:/app/app/static/CompressAudio

    networks:
      - compactify_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  compactify_network:
    driver: bridge
