version: '3.9'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: compactify_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-compactify_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Add custom PostgreSQL configuration for better connection handling
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    ports:
      - "${DB_PORT:-5432}:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-compactify_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - compactify_network

  # Flask Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compactify_web
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Flask Configuration
      FLASK_APP: server.py
      FLASK_ENV: ${FLASK_ENV:-production}
      DEBUG: ${DEBUG:-False}

      # Database Configuration (override .env for container)
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-compactify_db}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-compactify_db}

      # Python Configuration
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONPATH: /app
      OPENCV_LOG_LEVEL: ERROR

      # Gunicorn Configuration for better timeout handling
      GUNICORN_TIMEOUT: 120  # 2 minutes timeout
      GUNICORN_WORKERS: 2    # Reduced workers to prevent memory issues
      GUNICORN_WORKER_CLASS: sync
      GUNICORN_MAX_REQUESTS: 1000
      GUNICORN_MAX_REQUESTS_JITTER: 50
      GUNICORN_PRELOAD_APP: false  # Disabled to avoid conflicts with manual model preloading

      # Application Configuration (can be overridden by .env)
      SECRET_KEY: ${SECRET_KEY:-teguh}

    ports:
      - "${WEB_PORT:-5000}:5000"

    # Resource limits to prevent OOM
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

    # No local volume mounts needed - all files stored in Cloudflare R2

    networks:
      - compactify_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Increased to 2 minutes for model preloading

    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  compactify_network:
    driver: bridge
